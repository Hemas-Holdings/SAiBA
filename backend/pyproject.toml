[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "board-assistant-backend"
version = "0.1.0"
description = "Backend orchestration, speech, tools, and storage for the Board Knowledge Assistant"
requires-python = ">=3.11"
dependencies = [
    "azure-cognitiveservices-speech>=1.40",
    "claude-agent-sdk>=0.2.168,<0.3",
    "websockets>=13,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
include = ["orchestration*", "tools*", "stt*", "tts*", "storage*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: tests that call real external services (opt-in, need credentials)",
]
