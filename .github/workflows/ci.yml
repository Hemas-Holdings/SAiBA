name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop-app:
    name: Desktop app unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install desktop-app (dev)
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Unit tests with coverage gate
        run: >
          pytest tests
          --cov=capture
          --cov=session
          --cov=transport
          --cov=playback
          --cov=ui
          --cov-report=term-missing
          --cov-fail-under=80
          -m "not integration"

  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend and desktop client
        run: >
          python -m pip install --upgrade pip &&
          pip install -e ".[dev]" &&
          pip install -e "../desktop-app"
      - name: Unit tests with coverage gate
        run: >
          pytest tests
          --cov=stt
          --cov=orchestration
          --cov=tools
          --cov=tts
          --cov-report=term-missing
          --cov-fail-under=80
          -m "not integration"
