[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "board-assistant-desktop"
version = "0.1.0"
description = "Desktop capture app for the Board Knowledge Assistant"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.7",
]

[project.optional-dependencies]
windows = ["pyaudiowpatch>=0.2.12"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
]

[tool.setuptools.packages.find]
include = ["capture*", "wakeword*", "transport*", "playback*", "ui*", "session*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that use real audio devices (opt-in via RUN_LIVE_AUDIO=1)",
]
addopts = "-q"
